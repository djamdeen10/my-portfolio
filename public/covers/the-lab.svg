      <rect x="24" y="66" width="86" height="8" rx="4" fill-opacity="0.6"/>
      <rect x="24" y="92" width="188" height="8" rx="4" fill-opacity="0.26"/>
      <rect x="42" y="118" width="134" height="8" rx="4" fill-opacity="0.42"/>
      <rect x="42" y="144" width="212" height="8" rx="4" fill-opacity="0.18"/>
      <rect x="24" y="170" width="104" height="8" rx="4" fill-opacity="0.32"/>
