      <stop offset="0" stop-color="#1a0b13"/>
      <stop offset="0.55" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#170a12"/>
    </linearGradient>
    <radialGradient id="pl-glow" cx="0.32" cy="0.55" r="0.6">
