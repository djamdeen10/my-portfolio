    <script>
      (function () {
        try {
          var locales = {
            en: "en-US",
            fr: "fr-FR",
            es: "es-ES",
            ar: "ar",
            pt: "pt-PT",
            zh: "zh-CN",
            ja: "ja-JP",
            ru: "ru-RU",
          };
          var code = null;
          var first = window.location.pathname.split("/")[1] || "";
          if (locales[first]) code = first;
          else {
            var queryCode = new URLSearchParams(window.location.search).get("lang");
            if (locales[queryCode]) code = queryCode;
            else if (!first) code = localStorage.getItem("djamdeen:language");
          }
          if (locales[code]) {
            document.documentElement.lang = locales[code];
            document.documentElement.dir = code === "ar" ? "rtl" : "ltr";
            document.documentElement.dataset.language = code;
          }
        } catch (e) {}
      })();
      (function () {
        try {
          var key = "app-theme";
          var stored = localStorage.getItem(key) || "system";
          var resolved =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", resolved === "dark" ? "#0a0a0a" : "#fafafa");
        } catch (e) {}
      })();
    </script>
