<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Cover The lab">
  <defs>
    <linearGradient id="lab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07140f"/>
      <stop offset="0.55" stop-color="#0a0c0e"/>
      <stop offset="1" stop-color="#06120d"/>
    </linearGradient>
    <radialGradient id="lab-glow" cx="0.74" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.36"/>
      <stop offset="0.6" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lab-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="lab-flask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1fae5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="lab-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#lab-bg)"/>
  <rect width="1200" height="675" fill="url(#lab-glow)"/>
  <rect width="1200" height="675" fill="url(#lab-dots)"/>

  <g transform="translate(138 168)">
